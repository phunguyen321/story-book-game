<div class="game-scene">
  <!-- ================= SCENE 0: MÀN HÌNH MỞ ĐẦU ================= -->
  <div class="scene" *ngIf="currentScene === 0">
    <img src="/images/intro_123.png" alt="Mở đầu" class="full-screen-bg" />
    <div class="overlay-content center-align">
      <h1 class="book-title">Khu Vườn Của Thỏ Con</h1>
      <button class="btn-action" (click)="goToScene(1)">Đi chơi cùng Thỏ 🌸</button>
    </div>
  </div>

  <!-- ================= SCENE 1: CHẶNG 1 (/images/abc.png) ================= -->
  <div class="scene" *ngIf="currentScene === 1">
    <img src="/images/abc.png" alt="Chặng 1 Thỏ đi chơi" class="full-screen-bg" />

    <div class="narration-box">🗣️ "Thỏ Con đi chơi. Thỏ đi, thỏ đi!"</div>

    <!-- Vùng chạm cho Thỏ ở Cảnh 1 -->
    <div class="hotspot rabbit-spot-1" (click)="playRabbitSound()" (touchstart)="playRabbitSound()">
      <div class="speech-bubble" *ngIf="showRabbitBubble">Thỏ! Thỏ! 🐰</div>
    </div>

    <div class="nav-controls">
      <button class="btn-nav" (click)="goToScene(2)">Tiếp theo ➡️</button>
    </div>
  </div>

  <!-- ================= SCENE 2: CHẶNG 2 (/images/xyz.png) ================= -->
  <div class="scene" *ngIf="currentScene === 2">
    <img src="/images/xyz.png" alt="Chặng 2 Thỏ gặp hoa" class="full-screen-bg" />

    <div class="narration-box">🗣️ "Ó! Bông hoa đẹp quá! Hoa, hoa!"</div>

    <!-- VÙNG CHẠM THỎ (Được đính chính lại đúng hàm playRabbitSound) -->
    <div class="hotspot rabbit-spot-2" (click)="playRabbitSound()" (touchstart)="playRabbitSound()">
      <div class="speech-bubble" *ngIf="showRabbitBubble">Thỏ! Thỏ! 🐰</div>
    </div>

    <!-- VÙNG CHẠM HOA BỰ (Được đính chính lại đúng hàm playFlowerSound) -->
    <div class="hotspot flower-spot-2" (click)="playFlowerSound()" (touchstart)="playFlowerSound()">
      <div class="speech-bubble" *ngIf="showFlowerBubble">Hoa! Hoa! 🌸</div>
    </div>

    <div class="nav-controls">
      <button class="btn-nav" (click)="goToScene(1)">⬅️ Quay lại</button>
      <button class="btn-nav" (click)="goToScene(3)">Tiếp theo ➡️</button>
    </div>
  </div>

  <!-- ================= SCENE 3: CHẶNG 3 (/images/vvv.png) ================= -->
  <div class="scene" *ngIf="currentScene === 3">
    <img src="/images/vvv.png" alt="Chặng 3 Thỏ gặp bướm" class="full-screen-bg" />

    <div class="narration-box">🗣️ "Bướm bay! Bướm bay! Thỏ chào bướm nhé!"</div>

    <div class="hotspot rabbit-spot-3" (click)="playRabbitSound()" (touchstart)="playRabbitSound()">
      <div class="speech-bubble" *ngIf="showRabbitBubble">Thỏ! Thỏ! 🐰</div>
    </div>

    <div
      class="hotspot butterfly-spot-3"
      (click)="playButterflySound()"
      (touchstart)="playButterflySound()"
    >
      <div class="speech-bubble" *ngIf="showButterflyBubble">Bướm! Bướm! 🦋</div>
    </div>

    <div class="nav-controls">
      <button class="btn-nav" (click)="goToScene(2)">⬅️ Quay lại</button>
      <button class="btn-nav btn-finish" (click)="finishGame()">Kết thúc 🎉</button>
    </div>
  </div>
</div>
